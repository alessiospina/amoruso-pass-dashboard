version: '3.8'

services:
  # Database MySQL
  database:
    image: mysql:8.0
    container_name: amoruso-pass-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-amoruso_pass_db}
      MYSQL_USER: ${DB_USER:-amoruso_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-amoruso_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - amoruso-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Applicazione Next.js
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amoruso-pass-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # Database
      DATABASE_URL: mysql://${DB_USER:-amoruso_user}:${DB_PASSWORD:-amoruso_password}@database:3306/${DB_NAME:-amoruso_pass_db}
      
      # JWT
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      
      # NextAuth
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-your-super-secret-nextauth-key-change-this-in-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      
      # Email (OVH o altro provider)
      SMTP_HOST: ${SMTP_HOST:-smtp.ovh.net}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-your-email@domain.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-your-email-password}
      SMTP_FROM: ${SMTP_FROM:-your-email@domain.com}
      
      # Ambiente
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
    depends_on:
      database:
        condition: service_healthy
    networks:
      - amoruso-network
    volumes:
      # Mount per i log (opzionale)
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: amoruso-pass-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - amoruso-network

volumes:
  mysql_data:
    driver: local

networks:
  amoruso-network:
    driver: bridge
