<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <!-- Gradiente per il badge principale -->
    <linearGradient id="badgeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d6efd;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6610f2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a58ca;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradiente per l'accento -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#20c997;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0dcaf0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradiente per il testo -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:0.9" />
    </linearGradient>
    
    <!-- Ombra -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Badge principale con design più sofisticato -->
  <rect x="10" y="12" width="38" height="28" rx="6" ry="6" 
        fill="url(#badgeGradient)" 
        filter="url(#shadow)" 
        stroke="#ffffff" 
        stroke-width="1.5"/>
  
  <!-- Bordo interno decorativo -->
  <rect x="12" y="14" width="34" height="24" rx="4" ry="4" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="0.5"
        opacity="0.3"/>
  
  <!-- Chip principale -->
  <rect x="15" y="18" width="8" height="5" rx="1" fill="#ffd700" opacity="0.95"/>
  <rect x="16" y="19" width="6" height="3" rx="0.5" fill="#ffed4a" opacity="0.8"/>
  
  <!-- Linee dati stilizzate -->
  <rect x="26" y="18" width="16" height="1.5" rx="0.75" fill="#ffffff" opacity="0.9"/>
  <rect x="26" y="21" width="12" height="1.5" rx="0.75" fill="#ffffff" opacity="0.7"/>
  <rect x="26" y="24" width="18" height="1.5" rx="0.75" fill="#ffffff" opacity="0.6"/>
  
  <!-- Elementi decorativi (punti di sicurezza) -->
  <circle cx="40" cy="16" r="1.5" fill="#20c997" opacity="0.8"/>
  <circle cx="44" cy="16" r="1" fill="#0dcaf0" opacity="0.6"/>
  
  <!-- Banda di sicurezza -->
  <rect x="15" y="32" width="28" height="3" rx="1.5" fill="url(#accentGradient)" opacity="0.8"/>
  
  <!-- Testo "AMORUSO" con effetto glow -->
  <text x="58" y="26" 
        font-family="Arial, sans-serif" 
        font-size="17" 
        font-weight="bold" 
        fill="url(#textGradient)"
        filter="url(#glow)">AMORUSO</text>
  
  <!-- Testo "PASS" -->
  <text x="58" y="40" 
        font-family="Arial, sans-serif" 
        font-size="11" 
        font-weight="600" 
        fill="url(#accentGradient)" 
        letter-spacing="3px">PASS</text>
  
  <!-- Sottotitolo -->
  <text x="58" y="50" 
        font-family="Arial, sans-serif" 
        font-size="7.5" 
        fill="#ffffff" 
        opacity="0.7">GESTIONE INGRESSI</text>
  
  <!-- Elemento decorativo finale -->
  <rect x="58" y="43" width="45" height="0.5" rx="0.25" fill="url(#accentGradient)" opacity="0.5"/>
</svg>