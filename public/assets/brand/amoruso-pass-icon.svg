<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <!-- Gradiente per il badge principale -->
    <linearGradient id="badgeGradientIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d6efd;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6610f2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a58ca;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradiente per l'accento -->
    <linearGradient id="accentGradientIcon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#20c997;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0dcaf0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Ombra -->
    <filter id="shadowIcon" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
    
    <!-- Glow effect -->
    <filter id="glowIcon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Sfondo con gradiente sottile -->
  <circle cx="20" cy="20" r="18" fill="#ffffff" stroke="#e9ecef" stroke-width="2" opacity="0.95"/>
  <circle cx="20" cy="20" r="16" fill="none" stroke="url(#accentGradientIcon)" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Badge principale -->
  <rect x="7" y="10" width="18" height="14" rx="3" ry="3" 
        fill="url(#badgeGradientIcon)" 
        filter="url(#shadowIcon)"/>
  
  <!-- Bordo interno -->
  <rect x="8" y="11" width="16" height="12" rx="2" ry="2" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="0.3"
        opacity="0.4"/>
  
  <!-- Chip -->
  <rect x="9" y="13" width="4" height="2.5" rx="0.5" fill="#ffd700"/>
  <rect x="9.5" y="13.5" width="3" height="1.5" rx="0.3" fill="#ffed4a" opacity="0.8"/>
  
  <!-- Linee del pass -->
  <rect x="14.5" y="13.5" width="8" height="0.8" rx="0.4" fill="#ffffff" opacity="0.9"/>
  <rect x="14.5" y="15.5" width="6" height="0.8" rx="0.4" fill="#ffffff" opacity="0.7"/>
  <rect x="14.5" y="17.5" width="9" height="0.8" rx="0.4" fill="#ffffff" opacity="0.6"/>
  
  <!-- Elementi decorativi -->
  <circle cx="21" cy="12" r="0.8" fill="#20c997" opacity="0.8"/>
  <circle cx="23" cy="12" r="0.5" fill="#0dcaf0" opacity="0.6"/>
  
  <!-- Banda di sicurezza -->
  <rect x="9" y="20.5" width="14" height="1.5" rx="0.75" fill="url(#accentGradientIcon)" opacity="0.8"/>
  
  <!-- Lettera "A" stilizzata -->
  <text x="20" y="32" 
        font-family="Arial, sans-serif" 
        font-size="9" 
        font-weight="bold" 
        fill="url(#badgeGradientIcon)" 
        text-anchor="middle"
        filter="url(#glowIcon)">A</text>
  
  <!-- Punto decorativo sotto la A -->
  <circle cx="20" cy="34" r="0.8" fill="url(#accentGradientIcon)" opacity="0.6"/>
</svg>